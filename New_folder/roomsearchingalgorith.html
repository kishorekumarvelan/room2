        };

        function openKuulaLink() {
            var linkNumber = parseInt(document.getElementById('linkNumber').value);
            var kuulaLink = urls[linkNumber];
            if (kuulaLink) {
                // Create an iframe element for the selected link
                var iframe = document.createElement('iframe');
                iframe.width = "100%";
                iframe.height = "719px";
                iframe.src = kuulaLink;
                iframe.frameborder = "0";
                iframe.allowfullscreen = true;

                // Clear previous iframe content
                document.getElementById('kuulaContainer').innerHTML = "";

                // Append the iframe to the container div
                document.getElementById('kuulaContainer').appendChild(iframe);
            } else {
                alert("No URL found for the entered number.");
            }
        }
    </script>
